<style>

-accent);padding:3px 9px;font-size:12px;margin:3px 5px 3px 0}.reminders{border:1px dashed var(--line);border-radius:13px;padding:12px 14px;margin-top:18px}.reminders summary{cursor:pointer;color:var(--muted);font-weight:700;min-height:32px}.reminders p,.reminders li{color:var(--muted);font-size:14px}.editnote{font-size:12px;color:var(--muted);margin:10px 0}.editable[contenteditable=true]{outline:2px dashed var(--accent);outline-offset:4px;border-radius:4px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;z-index:10}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}.mobile-nav{display:none}
